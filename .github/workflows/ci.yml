name: Sistem Penggajian SMK PSKD 3 CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-build:
    name: Backend CI (Unit Tests & Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: be/package-lock.json

      - name: Install Backend Dependencies
        working-directory: be
        run: npm ci

      - name: Run Backend Unit Tests (17 Test Cases)
        working-directory: be
        run: npm test

      - name: Build Backend TypeScript
        working-directory: be
        run: npm run build

  frontend-build:
    name: Frontend CI (Build Validation)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: fe/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: fe
        run: npm ci

      - name: Build Next.js Application
        working-directory: fe
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3050/api
        run: npm run build
